<header class="scene"><span class="spark s1">✦</span><span class="spark s2">✿</span><div class="village">🌳 🏡 🌼</div><h1>내 마음과 닮은<br>먼작귀 친구는?</h1><p class="subtitle">먼작귀 마을에서 나와 닮은 친구를 찾아봐요!<br>12가지 선택으로 나의 마음 타입도 알아볼 수 있어요.</p></header>

<script>
const questions=[
 {q:'하치와레가풀뽑기 검정을 준비해요. 함께 공부한다면 나는…',a:[['친구들과 모여 서로 문제를 내고 응원하며 공부한다','E'],['조용한 곳에서 혼자 집중한 뒤 필요한 걸 나눈다','I']],axis:'EI'},
 {q:'치이카와와 하치와레가 처음 보는 신기한 간식을 발견했어요. 나는…',a:[['모양과 냄새, 실제 맛을 먼저 살펴본다','S'],['이 간식이 어디서 왔을지 재미있는 이야기를 상상한다','N']],axis:'SN'},
 {q:'친구가 검정 결과에 속상해해요. 먼저 건네고 싶은 말은?',a:[['다음에 나아질 방법을 같이 찾아보자고 한다','T'],['속상했겠다며 마음을 알아주고 곁에 있어 준다','F']],axis:'TF'},
 {q:'풀뽑기 검정 공부를 시작한다면 나는…',a:[['공부할 범위와 시간을 먼저 정해 계획대로 한다','J'],['그날 끌리는 부분부터 보고 유연하게 조정한다','P']],axis:'JP'},
 {q:'하치와레가 친구에게 받은 ‘칭찬 리본’을 자랑해요. 나는…',a:[['친구들과 함께 기뻐하며 이야기를 나눈다','E'],['둘만 있을 때 리본에 담긴 마음을 차분히 나눈다','I']],axis:'EI'},
 {q:'숲에서 낯선 버섯을 발견했어요. 나는 먼저…',a:[['생김새와 주변 환경을 자세히 관찰한다','S'],['이 버섯이 만드는 신기한 일들을 상상해본다','N']],axis:'SN'},
 {q:'토벌 중 친구들끼리 작전을 두고 의견이 달라요. 나는…',a:[['위험과 성공 가능성을 따져 가장 효과적인 방법을 고른다','T'],['모두가 안심하고 함께할 수 있도록 마음을 살핀다','F']],axis:'TF'},
 {q:'파자마 파티 무대에 서기로 했어요. 나는…',a:[['연습 순서와 준비물을 미리 정해 차근차근 맞춘다','J'],['아이디어를 주고받으며 당일 분위기에 맞춰 즐긴다','P']],axis:'JP'},
 {q:'긴 하루의 풀뽑기 일을 마친 뒤 기운을 채우는 방법은?',a:[['친구들과 간식을 나누며 오늘 일을 이야기한다','E'],['혼자 쉬면서 조용히 에너지를 회복한다','I']],axis:'EI'},
 {q:'파자마 파티즈의 노래와 춤을 함께 준비한다면 나는…',a:[['박자와 동작을 익혀 지금 눈앞의 공연을 탄탄히 만든다','S'],['무대의 분위기와 새롭게 해볼 연출을 떠올린다','N']],axis:'SN'},
 {q:'친구가 열심히 만든 공연에서 실수했어요. 나는…',a:[['어느 부분을 바꾸면 나아질지 구체적으로 제안한다','T'],['용기를 내준 마음을 먼저 알아주고 다독인다','F']],axis:'TF'},
 {q:'다 같이 소풍을 가는데 갑자기 비가 내려요. 나는…',a:[['준비해 둔 대안을 꺼내고 새 일정을 정한다','J'],['비 오는 날만의 재미를 찾아 즉석에서 계획을 바꾼다','P']],axis:'JP'}
];
const results={"ISTJ":["갑옷씨","yoroi","묵묵히 책임을 다하는 실무가","정해진 역할과 약속을 지키며 차근차근 해내는 당신은 마을의 갑옷씨와 잘 어울려요. 조용한 성실함으로 모두가 편히 움직이도록 받쳐줍니다.",["성실함","책임감","신뢰"]],"ISFJ":["시사","shisa","따뜻하게 보살피는 조력자","친구들의 필요를 세심히 살피고 꾸준히 도와주는 당신은 시사의 다정하고 성실한 모습과 닮았어요. 곁을 지켜주는 마음이 큰 힘이 됩니다.",["배려심","세심함","헌신"]],"INFJ":["데카츠요","dekatsuyo","마음을 읽는 통찰가","겉으로 드러나지 않은 마음과 의미를 깊이 생각하는 당신은 신비롭고 독특한 데카츠요와 연결돼요. 조용한 통찰로 주변을 새롭게 바라봅니다.",["통찰력","이상주의","섬세함"]],"INTJ":["마녀","witch","자기 길을 설계하는 전략가","목표를 세우고 자신만의 방식으로 길을 개척하는 당신은 이미지 속 INTJ 마녀와 잘 어울려요. 독립적인 사고와 긴 안목이 돋보입니다.",["전략적","독립적","집중력"]],"ISTP":["라코 선생님 · 쿠리만쥬",["rakko","kurimanju"],"실력으로 돌파하는 장인","필요한 순간 침착하게 판단하고 직접 해내는 당신은 거대한 존재와 맞서는 라코 선생님 타입이에요. 실전 감각과 담담한 자신감이 강점입니다.",["실행력","침착함","실전 감각"]],"ISFP":["오데 · 핑크 파자마짱",["ode","pink_pajama"],"자기만의 감성을 지닌 모험가","자유롭게 느끼고 자기 마음에 솔직한 당신은 따뜻한 오데와 닮았어요. 남들과 다른 순간도 받아들이며 지금의 경험을 소중히 합니다.",["감수성","자유로움","진정성"]],"INFP":["치이카와 · 카니짱(고서점)",["chiikawa","kani"],"마음을 믿는 다정한 몽상가","상냥하고 순수한 마음으로 친구를 아끼는 당신은 이미지 속 INFP 치이카와와 잘 맞아요. 두려워도 소중한 것을 위해 한 걸음 내딛는 용기가 있습니다.",["상상력","진정성","공감"]],"INTP":["라코 선생님","rakko","호기심 많은 탐구가","원리를 파고들고 자신만의 해답을 찾는 당신은 실력과 여유를 갖춘 라코 선생님을 추천해요. 직접 살펴보고 익히며 자기 전문성을 쌓아갑니다.",["분석력","독창성","탐구심"]],"ESTP":["우사기 · 아노코",["usagi","anoko"],"기회를 잡는 행동파","망설이기보다 먼저 움직이고 현장에서 답을 찾는 당신은 이미지 속 ESTP 우사기와 닮았어요. 예측 불가한 상황도 에너지와 순발력으로 즐깁니다.",["대담함","순발력","모험심"]],"ESFP":["모몽가","momonga","시선을 사로잡는 엔터테이너","자신을 표현하고 순간의 즐거움을 크게 누리는 당신은 이미지 속 ESFP 모몽가처럼 존재감이 강해요. 주변에 웃음과 생기를 불어넣습니다.",["사교성","표현력","낙천성"]],"ENFP":["하치와레","hachiware","모두를 끌어들이는 응원가","호기심과 밝은 에너지로 친구들과 새로운 일을 시작하는 당신은 하치와레와 잘 어울려요. 사람들의 가능성을 발견하고 함께 신나게 응원합니다.",["열정","창의력","공감"]],"ENTP":["우사기","usagi","규칙을 흔드는 아이디어맨","익숙한 방식을 벗어나 새 시도를 즐기는 당신은 우사기의 엉뚱하고 대담한 기질과 연결돼요. 재치 있는 발상으로 상황을 뒤집어 봅니다.",["재치","아이디어","도전정신"]],"ESTJ":["갑옷씨","yoroi","일을 정리하는 든든한 대장","해야 할 일을 빠르게 파악하고 모두가 움직이게 만드는 당신은 이미지 속 ESTJ 갑옷씨와 닮았어요. 책임감과 실행력으로 마을의 질서를 세웁니다.",["추진력","현실감각","조직력"]],"ESFJ":["토리 지로","torijiro","함께하는 분위기를 만드는 조정자","사람들 사이의 온기를 소중히 하고 공동체를 살피는 당신에게는 토리 지로를 추천해요. 주변을 챙기며 함께할 때 더 큰 힘을 냅니다.",["친화력","협동심","배려"]],"ENFJ":["하치와레","hachiware","친구를 북돋우는 리더","사람들의 장점을 알아보고 함께 성장하도록 격려하는 당신은 이미지 속 ENFJ 하치와레와 닮았어요. 따뜻한 말과 행동으로 친구들을 이끕니다.",["리더십","공감","격려"]],"ENTJ":["고블린","goblin","목표를 밀어붙이는 지휘자","큰 목표를 세우고 방향을 잡아 힘 있게 추진하는 당신은 이미지 속 ENTJ 고블린과 어울려요. 결단력과 조직력으로 새로운 길을 엽니다.",["결단력","목표의식","추진력"]]};
let index=0, answers=[],scores={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0},last={};
const $=s=>document.querySelector(s);
$('#begin').onclick=()=>{ $('#start').classList.add('hidden');$('#quiz').classList.remove('hidden');render(); };

function pick(letter,axis){scores[letter]++;last[axis]=letter;answers.push(letter);index++;if(index<questions.length)render();else showResult()}
